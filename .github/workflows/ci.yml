name: Build Merian

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build ${{ matrix.buildtype }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        buildtype: [debugoptimized, release]
        meson_version: ["1.11.2"]
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.290.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Install dependencies
        run: python -m pip install meson==${{ matrix.meson_version }} ninja
      # Meson's CMake subproject translation misses compile-order dependencies on
      # generated files (OBJECT_DEPENDS and transitive target dependencies), which
      # breaks clean builds of the glslang/SPIRV-Tools wrap.
      # See https://github.com/mesonbuild/meson/issues/9062 - drop once fixed upstream.
      - name: Patch meson CMake subproject dependencies
        shell: bash
        run: |
          MESON_DIR=$(python -c "import mesonbuild, os; print(os.path.dirname(os.path.dirname(mesonbuild.__file__)))")
          git apply --unsafe-paths --directory="$MESON_DIR" .github/meson-cmake-generated-deps.patch
      - name: Prepare MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
      - name: Install dependencies for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get -y install \
            libxkbcommon-dev \
            xorg-dev
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Setup Project
        run: meson setup build --buildtype=${{ matrix.buildtype }}
      - name: Compile Project
        run: meson compile -C build
